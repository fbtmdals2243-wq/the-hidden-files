content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="application-name" content="The Hidden Files">

<meta name="app-version" content="2.0.0-public-alpha.1">

name="description"

<a class="skip-link" href="#app">

</a>

    role="status"
    aria-live="polite"
